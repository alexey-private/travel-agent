name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Does every build input of an image sit behind that service's Railway watch
  # patterns? Reads the Dockerfiles and deploy/railway-services.json — no
  # network, no token, no install — so it goes red in the same commit that adds
  # an uncovered build input, before anything is deployed.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:deploy

  # The locale set, the dictionary-entry shape and the string resolver every
  # other package builds on. `npm ci` compiles it (root postinstall), so the
  # jobs below get it without a step of their own.
  shared-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@travel-agent/i18n
      - run: npm run test:all --workspace=@travel-agent/i18n

  backend-langgraph:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: travel_agent_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d travel_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/travel_agent_test
      TEST_DATABASE_URL: postgresql://user:password@localhost:5432/travel_agent_test
      TAVILY_API_KEY: ci-dummy
      OPENWEATHER_API_KEY: ci-dummy
      ANTHROPIC_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p backend-langgraph/tsconfig.json --noEmit
      - run: npm run test:all --workspace=backend-langgraph

  backend-telegram:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy
      BACKEND_URL: http://localhost:3002
      OPENWEATHER_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=backend-telegram
      - run: npm run test:all --workspace=backend-telegram

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=frontend
      - run: npm run build --workspace=frontend
